name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets the workflow publish to Pages through the official deployment flow.
permissions:
  contents: read
  pages: write
  id-token: write

# A running deployment finishes rather than being cancelled by a new push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The page imports the compiled output, so the demo always runs the code
      # that is published.
      - run: npm run demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
